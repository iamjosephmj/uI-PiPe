name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Unit tests + API check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Binary-compatibility check + unit tests + build
        run: >
          ./gradlew --no-daemon --stacktrace
          :pipe:apiCheck
          :pipe:testDebugUnitTest
          :pipe-serialization:testDebugUnitTest
          :sample-host:testDebugUnitTest
          :sample-provider:testDebugUnitTest
          :sample-solo:assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
