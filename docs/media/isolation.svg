<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="820" height="300" rx="16" fill="#0f1620"/>
  <text x="410" y="38" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="700">Two processes — two of everything the runtime gives you</text>

  <!-- Host process -->
  <g>
    <rect x="40" y="70" width="300" height="180" rx="14" fill="#16202e" stroke="#2f81f7" stroke-width="1.5"/>
    <text x="190" y="98" text-anchor="middle" fill="#79c0ff" font-size="15" font-weight="700">Host process</text>
    <!-- main thread -->
    <rect x="66" y="120" width="248" height="16" rx="8" fill="#233247"/>
    <rect x="66" y="120" width="248" height="16" rx="8" fill="#2f81f7">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="132" fill="#cdd9e5" font-size="10.5" font-weight="600">main / UI thread</text>
    <!-- render thread -->
    <rect x="66" y="150" width="248" height="12" rx="6" fill="#233247"/>
    <rect x="66" y="150" width="120" height="12" rx="6" fill="#3fb950">
      <animate attributeName="width" values="30;220;30" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="188" fill="#8b98a5" font-size="10.5">RenderThread · heap · GC</text>
    <!-- gc -->
    <g transform="translate(300,205)">
      <circle r="10" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="40 22">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="70" y="212" fill="#8b98a5" font-size="10.5">own GC pauses</text>
  </g>

  <!-- Provider process -->
  <g>
    <rect x="480" y="70" width="300" height="180" rx="14" fill="#16202e" stroke="#a371f7" stroke-width="1.5"/>
    <text x="630" y="98" text-anchor="middle" fill="#d2a8ff" font-size="15" font-weight="700">Provider process</text>
    <rect x="506" y="120" width="248" height="16" rx="8" fill="#233247"/>
    <rect x="506" y="120" width="248" height="16" rx="8" fill="#a371f7">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="510" y="132" fill="#cdd9e5" font-size="10.5" font-weight="600">main / UI thread</text>
    <rect x="506" y="150" width="248" height="12" rx="6" fill="#233247"/>
    <rect x="506" y="150" width="120" height="12" rx="6" fill="#3fb950">
      <animate attributeName="width" values="220;30;220" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <text x="510" y="188" fill="#8b98a5" font-size="10.5">RenderThread · heap · GC</text>
    <g transform="translate(740,205)">
      <circle r="10" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="40 22">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="510" y="212" fill="#8b98a5" font-size="10.5">isolated crash domain</text>
  </g>

  <!-- binder channel -->
  <line x1="340" y1="160" x2="480" y2="160" stroke="#3d4b5c" stroke-width="2"/>
  <circle cx="340" cy="160" r="5" fill="#79c0ff">
    <animate attributeName="cx" values="340;480;340" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#79c0ff;#d2a8ff;#79c0ff" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="410" y="150" text-anchor="middle" fill="#8b98a5" font-size="10">verified binder</text>
  <text x="410" y="283" text-anchor="middle" fill="#6b7684" font-size="11">Isolation, not extra CPU — the two runtimes still share the device's cores.</text>
</svg>
