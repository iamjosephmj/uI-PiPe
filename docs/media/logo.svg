<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="uI-PiPe logo — a pipe from host (blue) to provider (purple), verified">
  <defs>
    <linearGradient id="pipe" x1="42" y1="30" x2="78" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="bg" x1="12" y1="8" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18232F"/>
      <stop offset="1" stop-color="#0D141D"/>
    </linearGradient>
    <clipPath id="badge"><rect width="108" height="108" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <!-- pipe body: host (blue) → provider (purple) -->
    <path d="M42,32 L42,54 Q42,66 54,66 L76,66" fill="none" stroke="url(#pipe)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- sheen -->
    <path d="M42,32 L42,54 Q42,66 54,66 L76,66" fill="none" stroke="#DBE9FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <!-- flanges -->
    <rect x="29" y="23" width="26" height="10" rx="3" fill="#5A6B80"/>
    <rect x="75" y="53" width="10" height="26" rx="3" fill="#5A6B80"/>
    <!-- bolts (one green = verified boundary) -->
    <circle cx="34" cy="28" r="2" fill="#3FB950"/>
    <circle cx="50" cy="28" r="2" fill="#0D141D"/>
    <circle cx="80" cy="58" r="2" fill="#0D141D"/>
    <circle cx="80" cy="74" r="2" fill="#0D141D"/>
  </g>
</svg>
