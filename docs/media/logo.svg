<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="uI-PiPe logo — an elbow pipe with bolted flanges">
  <defs>
    <linearGradient id="bg" x1="14" y1="10" x2="94" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F3D3A"/>
      <stop offset="1" stop-color="#0A222E"/>
    </linearGradient>
    <clipPath id="badge"><rect width="108" height="108" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <!-- Pipe body: an elbow bend (down, then right), with a sheen highlight. -->
    <path d="M42,32 L42,54 Q42,66 54,66 L76,66" fill="none" stroke="#5EEAD4" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42,32 L42,54 Q42,66 54,66 L76,66" fill="none" stroke="#CFFAF3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flanges cap the two openings. -->
    <rect x="28" y="23" width="28" height="10" rx="3" fill="#2DD4BF"/>
    <rect x="75" y="53" width="10" height="28" rx="3" fill="#2DD4BF"/>
    <!-- Bolt holes. -->
    <circle cx="34" cy="28" r="2" fill="#0A222E"/>
    <circle cx="50" cy="28" r="2" fill="#0A222E"/>
    <circle cx="80" cy="58" r="2" fill="#0A222E"/>
    <circle cx="80" cy="74" r="2" fill="#0A222E"/>
  </g>
</svg>
