<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="820" height="340" rx="16" fill="#0f1620"/>
  <text x="410" y="34" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="700">See it happen — a cross-process certification, live</text>

  <!-- host side caption -->
  <text x="150" y="90" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="700">Host app</text>
  <text x="670" y="90" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="700">Provider (other process)</text>

  <!-- phone frame -->
  <rect x="330" y="70" width="160" height="252" rx="22" fill="#0b1017" stroke="#3d4b5c" stroke-width="2"/>
  <rect x="396" y="78" width="28" height="5" rx="2.5" fill="#3d4b5c"/>
  <rect x="342" y="90" width="136" height="220" rx="8" fill="#0e141d"/>
  <!-- status chip -->
  <rect x="350" y="98" width="60" height="14" rx="7" fill="#16202e" stroke="#2f81f7" stroke-width="0.8"/>
  <text x="380" y="108" text-anchor="middle" fill="#79c0ff" font-size="8">Connected</text>

  <!-- STATE A: idle -->
  <g>
    <rect x="350" y="120" width="120" height="96" rx="8" fill="#eaf0f6"/>
    <rect x="358" y="130" width="72" height="7" rx="3.5" fill="#111"/>
    <text x="360" y="152" fill="#333" font-size="8">pane-ready</text>
    <rect x="350" y="226" width="120" height="20" rx="10" fill="#2f81f7"/>
    <text x="410" y="239" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="700">Request certification</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;0;0;0;1" keyTimes="0;0.20;0.235;0.5;0.7;0.95;0.98;1"/>
  </g>
  <!-- tap ripple on Request -->
  <circle cx="410" cy="236" r="2" fill="#fff">
    <animate attributeName="r" dur="8s" repeatCount="indefinite" values="2;2;22;2;2" keyTimes="0;0.205;0.24;0.245;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.55;0;0" keyTimes="0;0.205;0.235;0.245;1"/>
  </circle>

  <!-- STATE B: consent -->
  <g opacity="0">
    <rect x="350" y="120" width="120" height="150" rx="8" fill="#eaf0f6"/>
    <rect x="358" y="130" width="80" height="7" rx="3.5" fill="#111"/>
    <text x="360" y="150" fill="#444" font-size="7.5">consent required</text>
    <text x="360" y="164" fill="#111" font-size="8" font-weight="700">Host requests certification</text>
    <text x="360" y="178" fill="#888" font-size="7">challenge 8ae5f1b1…</text>
    <rect x="358" y="188" width="50" height="18" rx="9" fill="#fff" stroke="#00696d"/>
    <text x="383" y="200" text-anchor="middle" fill="#00696d" font-size="8" font-weight="700">Decline</text>
    <rect x="414" y="188" width="50" height="18" rx="9" fill="#00696d"/>
    <text x="439" y="200" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">Approve</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.235;0.25;0.5;0.52;1"/>
  </g>
  <!-- tap ripple on Approve -->
  <circle cx="439" cy="197" r="2" fill="#fff">
    <animate attributeName="r" dur="8s" repeatCount="indefinite" values="2;2;18;2;2" keyTimes="0;0.485;0.515;0.52;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.6;0;0" keyTimes="0;0.485;0.51;0.52;1"/>
  </circle>

  <!-- STATE C: verifying -->
  <g opacity="0">
    <rect x="350" y="150" width="120" height="90" rx="8" fill="#16202e"/>
    <g transform="translate(410,185)">
      <circle r="12" fill="none" stroke="#2f81f7" stroke-width="3" stroke-dasharray="45 30">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="410" y="222" text-anchor="middle" fill="#cdd9e5" font-size="8.5">Verifying certification…</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.52;0.535;0.66;0.68;1"/>
  </g>

  <!-- STATE D: verified -->
  <g opacity="0">
    <rect x="350" y="140" width="120" height="110" rx="8" fill="#12261a" stroke="#3fb950" stroke-width="1"/>
    <circle cx="372" cy="168" r="11" fill="#3fb950"/>
    <path d="M367,168 l4,4 l7,-8" fill="none" stroke="#0e141d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="390" y="166" fill="#3fb950" font-size="11" font-weight="800">Hardware-</text>
    <text x="390" y="178" fill="#3fb950" font-size="11" font-weight="800">verified</text>
    <text x="360" y="206" fill="#9fb0c0" font-size="7.5">signature ok · challenge ok</text>
    <text x="360" y="218" fill="#9fb0c0" font-size="7.5">chain ok · Google root</text>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.68;0.70;0.96;1"/>
  </g>

  <!-- message channel arrows host<->provider -->
  <!-- nonce host->provider around consent time -->
  <g>
    <line x1="180" y1="200" x2="330" y2="200" stroke="#3fb950" stroke-width="2" marker-end="url(#a1)" opacity="0"/>
    <circle cx="180" cy="200" r="4" fill="#3fb950" opacity="0">
      <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="180;180;330;330;180;180" keyTimes="0;0.22;0.25;0.26;0.27;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0;0" keyTimes="0;0.22;0.248;0.26;0.27;1"/>
    </circle>
    <text x="255" y="192" text-anchor="middle" fill="#6b7684" font-size="9">nonce →</text>
  </g>
  <!-- signed response provider->host around verify time -->
  <g>
    <circle cx="490" cy="230" r="4" fill="#2f81f7" opacity="0">
      <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="490;490;660;660;490;490" keyTimes="0;0.505;0.535;0.545;0.555;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0;0" keyTimes="0;0.505;0.533;0.545;0.555;1"/>
    </circle>
    <text x="575" y="222" text-anchor="middle" fill="#6b7684" font-size="9">◄ signature + attestation chain</text>
  </g>
  <text x="670" y="255" text-anchor="middle" fill="#8b98a5" font-size="9">AndroidKeyStore signs the nonce</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/></marker>
  </defs>
</svg>
