<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <!-- cylindrical steel body: highlight near top, shadow at bottom -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a4f"/>
      <stop offset="0.16" stop-color="#5b7594"/>
      <stop offset="0.5" stop-color="#2b3a4f"/>
      <stop offset="1" stop-color="#131b26"/>
    </linearGradient>
    <linearGradient id="flange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a5e"/>
      <stop offset="0.16" stop-color="#7189a6"/>
      <stop offset="0.5" stop-color="#33435a"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <clipPath id="bore"><rect x="150" y="98" width="520" height="34" rx="10"/></clipPath>
  </defs>

  <rect width="820" height="220" rx="16" fill="#0f1620"/>

  <!-- end apps -->
  <rect x="34" y="78" width="96" height="74" rx="12" fill="#16202e" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="82" y="112" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="700">Host</text>
  <text x="82" y="130" text-anchor="middle" fill="#8b98a5" font-size="10">app</text>
  <rect x="690" y="78" width="96" height="74" rx="12" fill="#16202e" stroke="#a371f7" stroke-width="1.5"/>
  <text x="738" y="108" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="700">Provider</text>
  <text x="738" y="126" text-anchor="middle" fill="#8b98a5" font-size="10">own process</text>

  <!-- pipe body -->
  <rect x="130" y="90" width="560" height="50" rx="14" fill="url(#steel)" stroke="#0a0f16" stroke-width="1.5"/>
  <!-- top spec highlight -->
  <rect x="140" y="97" width="540" height="4" rx="2" fill="#8fa8c4" opacity="0.5"/>
  <!-- dark bore -->
  <rect x="150" y="98" width="520" height="34" rx="10" fill="#0b121c"/>

  <!-- flanges / couplings (plumbing joints) -->
  <rect x="150" y="82" width="18" height="66" rx="5" fill="url(#flange)" stroke="#0a0f16"/>
  <rect x="652" y="82" width="18" height="66" rx="5" fill="url(#flange)" stroke="#0a0f16"/>
  <rect x="402" y="84" width="16" height="62" rx="5" fill="url(#flange)" stroke="#0a0f16"/>

  <!-- flowing packets, clipped to the bore -->
  <g clip-path="url(#bore)">
    <!-- host -> provider (blue) -->
    <g fill="#79c0ff">
      <circle cx="0" cy="115" r="6"><animate attributeName="cx" values="150;670" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="115" r="6"><animate attributeName="cx" values="150;670" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="115" r="6"><animate attributeName="cx" values="150;670" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- provider -> host (purple) -->
    <g fill="#d2a8ff">
      <circle cx="0" cy="115" r="5"><animate attributeName="cx" values="670;150" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="115" r="5"><animate attributeName="cx" values="670;150" dur="2.9s" begin="1.9s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <text x="410" y="176" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">One pipe — a verified, two-way channel between two apps' processes</text>
  <text x="410" y="196" text-anchor="middle" fill="#6b7684" font-size="11">live UI one way, typed messages both ways, a signing-identity gate on each end</text>
</svg>
