<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="820" height="300" rx="16" fill="#0f1620"/>
  <text x="410" y="34" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="700">Every open is a mutual, verified handshake</text>

  <!-- lifelines -->
  <text x="150" y="66" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="700">Host</text>
  <text x="670" y="66" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="700">Provider</text>
  <line x1="150" y1="76" x2="150" y2="286" stroke="#2f81f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="670" y1="76" x2="670" y2="286" stroke="#a371f7" stroke-width="1.5" opacity="0.5"/>

  <!-- 1 verify (host) -->
  <g>
    <circle cx="150" cy="98" r="6" fill="#79c0ff"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.3;0.3;1;0.3;0.3" keyTimes="0;0;0.071;0.15;1"/></circle>
    <text x="168" y="102" fill="#cdd9e5" font-size="12.5">1 · resolve provider cert (PackageManager)</text>
  </g>
  <!-- 2 authorize (host) -->
  <g>
    <circle cx="150" cy="128" r="6" fill="#79c0ff"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.3;0.3;1;0.3;0.3" keyTimes="0;0.143;0.214;0.3;1"/></circle>
    <text x="168" y="132" fill="#cdd9e5" font-size="12.5">2 · authorize (fail-closed) — else no bind</text>
  </g>
  <!-- 3 open -> -->
  <g>
    <line x1="162" y1="160" x2="658" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#ar)"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.25;0.25;1;0.25;0.25" keyTimes="0;0.286;0.357;0.45;1"/></line>
    <text x="410" y="153" text-anchor="middle" fill="#8b98a5" font-size="11.5">open(OpenSpec = inputTransferToken, size, request)</text>
  </g>
  <!-- 4 read uid + gate (provider) -->
  <g>
    <circle cx="670" cy="188" r="6" fill="#d2a8ff"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.3;0.3;1;0.3;0.3" keyTimes="0;0.429;0.5;0.58;1"/></circle>
    <text x="652" y="192" text-anchor="end" fill="#cdd9e5" font-size="12.5">3 · read caller UID (kernel) + authorize host</text>
  </g>
  <!-- 5 build surface (provider) -->
  <g>
    <circle cx="670" cy="218" r="6" fill="#d2a8ff"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.3;0.3;1;0.3;0.3" keyTimes="0;0.571;0.643;0.72;1"/></circle>
    <text x="652" y="222" text-anchor="end" fill="#cdd9e5" font-size="12.5">4 · onOpenPane() → SurfaceControlViewHost</text>
  </g>
  <!-- 6 surface back <- -->
  <g>
    <line x1="658" y1="250" x2="162" y2="250" stroke="#2f81f7" stroke-width="2" marker-end="url(#ar2)"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0.25;0.25;1;0.25;0.25" keyTimes="0;0.714;0.786;0.87;1"/></line>
    <text x="410" y="243" text-anchor="middle" fill="#8b98a5" font-size="11.5">◄ SurfacePackage + session + message channel</text>
  </g>

  <!-- pane appears at host -->
  <rect x="120" y="262" width="60" height="20" rx="4" fill="#eaf0f6"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.857;0.92;0.99;1"/></rect>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3fb950"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2f81f7"/></marker>
  </defs>
</svg>
