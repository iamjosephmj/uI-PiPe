<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="820" height="320" rx="16" fill="#0f1620"/>
  <text x="410" y="36" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="700">One provider pane, three ways the host can show it</text>

  <!-- phone frame -->
  <rect x="330" y="52" width="160" height="238" rx="22" fill="#0b1017" stroke="#3d4b5c" stroke-width="2"/>
  <rect x="342" y="70" width="136" height="202" rx="8" fill="#0e141d"/>
  <rect x="396" y="60" width="28" height="5" rx="2.5" fill="#3d4b5c"/>

  <!-- EMBEDDED -->
  <g>
    <rect x="350" y="80" width="120" height="20" rx="5" fill="#16202e"/>
    <rect x="358" y="120" width="104" height="70" rx="8" fill="#eaf0f6"/>
    <rect x="366" y="130" width="60" height="7" rx="3.5" fill="#2f81f7"/>
    <rect x="366" y="144" width="80" height="6" rx="3" fill="#c4ccd6"/>
    <rect x="358" y="210" width="104" height="18" rx="9" fill="#233247"/>
    <text x="410" y="304" text-anchor="middle" fill="#79c0ff" font-size="14" font-weight="700">Embedded — PipeView in your layout</text>
    <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="1;1;0;0;0;0;1" keyTimes="0;0.29;0.35;0.63;0.90;0.96;1"/>
  </g>

  <!-- FULL SCREEN -->
  <g opacity="0">
    <rect x="349" y="78" width="122" height="186" rx="7" fill="#eaf0f6"/>
    <rect x="360" y="92" width="70" height="8" rx="4" fill="#2f81f7"/>
    <rect x="360" y="108" width="100" height="6" rx="3" fill="#c4ccd6"/>
    <rect x="360" y="122" width="90" height="6" rx="3" fill="#c4ccd6"/>
    <rect x="360" y="236" width="46" height="16" rx="8" fill="#00696d"/>
    <rect x="414" y="236" width="46" height="16" rx="8" fill="#d7dee7"/>
    <text x="410" y="304" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">Full-screen — PipeFullScreen.open()</text>
    <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0;0;0" keyTimes="0;0.29;0.35;0.57;0.63;0.9;1"/>
  </g>

  <!-- DIALOG -->
  <g opacity="0">
    <rect x="342" y="70" width="136" height="202" rx="8" fill="#0b1017" opacity="0.72"/>
    <rect x="356" y="120" width="108" height="104" rx="12" fill="#eaf0f6"/>
    <rect x="366" y="134" width="66" height="8" rx="4" fill="#2f81f7"/>
    <rect x="366" y="150" width="88" height="6" rx="3" fill="#c4ccd6"/>
    <rect x="366" y="198" width="42" height="16" rx="8" fill="#00696d"/>
    <rect x="416" y="198" width="40" height="16" rx="8" fill="#d7dee7"/>
    <text x="410" y="304" text-anchor="middle" fill="#d2a8ff" font-size="14" font-weight="700">Dialog — PipeDialog.show()</text>
    <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" values="0;0;1;1;0;0;0" keyTimes="0;0.63;0.69;0.90;0.96;0.99;1"/>
  </g>

  <text x="410" y="60" text-anchor="middle" fill="#6b7684" font-size="11" opacity="0"/>
</svg>
